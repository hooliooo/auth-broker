# The registry store: installations and their keys, written by provisioning automation and by
# installations enrolling their own keys; the hub follows it. A stand-in for the managed
# PostgreSQL production would use. Separate from Keycloak's database.
apiVersion: v1
kind: Service
metadata:
  name: registry-postgres
  labels: { app: registry-postgres }
spec:
  selector: { app: registry-postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-postgres
spec:
  serviceName: registry-postgres
  replicas: 1
  selector:
    matchLabels: { app: registry-postgres }
  template:
    metadata:
      labels: { app: registry-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          env:
            - { name: POSTGRES_DB, value: registry }
            - { name: POSTGRES_USER, value: hub }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: registry-db, key: password }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-d", "registry", "-U", "hub"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
