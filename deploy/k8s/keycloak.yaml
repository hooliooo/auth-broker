# Keycloak with the organization membership extension (providers/keycloak), behind the ingress
# at https://keycloak.broker.localhost. Browsers and in-cluster callers use that one address: it
# resolves to this machine for browsers, and CoreDNS sends pods to the ingress, so the issuer is
# the same everywhere.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  selector: { app: keycloak }
  ports:
    - name: http
      port: 8080
    - name: management
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: auth-broker-kind-edge-keycloak:dev
          imagePullPolicy: Never
          args: ["start"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: username }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: password }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://keycloak-postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak_admin }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
            - { name: KC_HOSTNAME, value: "https://keycloak.broker.localhost" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: local-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [keycloak.broker.localhost]
      secretName: keycloak-tls
  rules:
    - host: keycloak.broker.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { name: http }
