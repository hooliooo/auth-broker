# The measurement stack: the capacity measurements in perf/ run against it, with
# docker-compose.perf.yml, because they read each container's CPU from Docker. For development
# and the e2e tests, use the local cluster instead (dev/k8s/up.sh; README.md, "Running it
# locally").
#
# The auth broker with one edge per app kind, locally, with three kinds and its own Keycloak.
# Each kind's edge serves all its sites, each under its own host, and calls the APIs itself:
#   inspection edge (5201):  http://plant-a.localhost:5201, http://plant-b.localhost:5201, calling
#                            the kind's one central API with each site's token
#   maintenance edge (5203): http://plant-d.localhost:5203, http://plant-e.localhost:5203, calling
#                            each site's own API
#   billing edge (5202):     http://plant-c.localhost:5202; billing keeps the hub forwarding its
#                            API calls, the option a kind can still choose
# Each kind has its own Keycloak client, audience, edge key and stand-in API.
#
# From the workspace root, once: dev/generate-dev-keys.sh (it writes dev/registry-compose)
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up -d --build
#   cargo test --release -p e2e --features load --test load -- --nocapture --test-threads=1
name: auth-broker-kind-edge

x-broker: &broker
  image: auth-broker-kind-edge:dev
  build:
    context: .
    dockerfile: Dockerfile
  restart: on-failure

x-edge-env: &edge-env
  RUST_LOG: edge=debug,info
  HUB_URL: http://localhost:8090
  HUB_INTERNAL_URL: http://hub:8090
  EDGE_KEY_FILE: /etc/edge/edge.key
  REGISTRY_DIR: /etc/edge/registry
  REGISTRY_RELOAD_SECS: "2"
  ALLOW_INSECURE_HTTP: "true"
  # The tests send each simulated browser's address in this header, as Cloudflare would. They
  # connect from the host, whose address varies by platform: trust everything, here only.
  CLIENT_IP_HEADER: cf-connecting-ip
  TRUSTED_PROXIES: 0.0.0.0/0,::/0

x-echo-env: &echo-env
  IDENTITY_PROVIDER: keycloak
  ISSUER_URI: http://localhost:8280/realms/broker
  DISCOVERY_URI: http://keycloak:8080/realms/broker
  ALLOW_INSECURE_HTTP: "true"
  REVEAL_TOKEN: "true"

# A key file must exist before the stack starts (generate-dev-keys.sh), not become a directory.
x-key: &key
  type: bind
  read_only: true
  bind:
    create_host_path: false

services:
  # Keycloak with the organization membership extension (providers/keycloak/extension).
  keycloak:
    image: auth-broker-kind-edge-keycloak:dev
    build: ./providers/keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: test
      # Tokens and browsers use localhost:8280; containers reach it as keycloak:8080.
      KC_HOSTNAME: http://localhost:8280
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8280:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  keycloak-setup:
    image: keycloak-config
    build: ./providers/keycloak/config
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./providers/keycloak/setup/:/mnt/setup:ro
      - ./dev/registry-compose/:/mnt/registry:ro
    environment:
      keycloak_url: "http://keycloak:8080"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "test"
      realm: "broker"
      app_kinds: "inspection billing maintenance"
      direct_kinds: "inspection maintenance"
      # The inspection kind's back-channel logout goes through the recorder.
      relay_kind: inspection
      relay_url: http://test-helpers:8000/relay/backchannel-logout
    command: ["bash", "-c", "bash /mnt/setup/setup_realm.sh || { echo 'FAILED setup_realm.sh'; exit 1; }"]

  # Test helpers (crates/test-helpers, from the BFF's e2e stack): a proxy in front of Keycloak for the hub's
  # server-to-server calls that tests can make fail, and a recorder for the inspection kind's
  # back-channel logout tokens that passes them on to the hub. Reached by the tests on 5290.
  test-helpers:
    build:
      context: .
      dockerfile: crates/test-helpers/Dockerfile
    ports:
      - "5290:8000"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      BACKCHANNEL_TARGET: http://hub:8090/auth/backchannel-logout/inspection

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stand-in APIs. Ports are published only so tests can present a token to the wrong kind
  # directly. Inspection's one central API serves all its sites: it accepts tokens of the
  # inspection client naming any one site, and scopes by the site the token names.
  api-inspection:
    <<: *broker
    command: ["test-api"]
    ports:
      - "8181:8081"
    environment:
      <<: *echo-env
      EXPECTED_AUDIENCE: inspection-api
      EXPECTED_CLIENT: hub-inspection

  api-billing:
    <<: *broker
    command: ["test-api"]
    ports:
      - "8182:8081"
    environment:
      <<: *echo-env
      EXPECTED_AUDIENCE: billing-api

  hub:
    <<: *broker
    command: ["hub"]
    ports:
      - "8090:8090"
      # Metrics, reached by the tests; never on the public port.
      - "8091:9100"
    environment:
      RUST_LOG: hub=debug,info
      IDENTITY_PROVIDER: keycloak
      ISSUER_URI: http://localhost:8280/realms/broker
      # Server-to-server Keycloak calls go through the helpers' proxy, so tests can make them fail.
      DISCOVERY_URI: http://test-helpers:8081/realms/broker
      HUB_PUBLIC_URL: http://localhost:8090
      ALLOW_INSECURE_HTTP: "true"
      REDIS_URI: redis://redis:6379
      REGISTRY_DIR: /etc/hub/registry
      REGISTRY_RELOAD_SECS: "2"
      CLIENT_CREDENTIALS: private_key_jwt
      CLIENT_KEY_FILE: /run/secrets/hub-client-key.pem
      # Browsers reach the hub only while signing in; the tests say who they are, as above.
      CLIENT_IP_HEADER: cf-connecting-ip
      TRUSTED_PROXIES: 0.0.0.0/0,::/0
      LOGIN_PER_MINUTE_PER_IP: "10000"
    volumes:
      - ./dev/registry-compose/:/etc/hub/registry:ro
      - <<: *key
        source: ./dev/keys/hub-client-key.pem
        target: /run/secrets/hub-client-key.pem
    depends_on:
      test-helpers:
        condition: service_started
      redis:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully

  # The maintenance kind: its edge calls each site's own API (the site's api_url), with
  # Keycloak's access token from the hub; each API accepts only tokens naming its site.
  api-plant-d:
    <<: *broker
    command: ["test-api"]
    ports:
      - "8183:8081"
    environment:
      <<: *echo-env
      EXPECTED_AUDIENCE: maintenance-api
      EXPECTED_CLIENT: hub-maintenance
      EXPECTED_SITE: plant-d

  api-plant-e:
    <<: *broker
    command: ["test-api"]
    ports:
      - "8184:8081"
    environment:
      <<: *echo-env
      EXPECTED_AUDIENCE: maintenance-api
      EXPECTED_CLIENT: hub-maintenance
      EXPECTED_SITE: plant-e

  # Every inspection site: plant-a, plant-b (and the retired and rate-limited test sites).
  edge-inspection:
    <<: *broker
    command: ["edge"]
    ports:
      - "5201:5200"
    environment:
      <<: *edge-env
      APP_ID: inspection
    volumes:
      - ./dev/registry-compose/:/etc/edge/registry:ro
      - <<: *key
        source: ./dev/keys/edge-inspection.key
        target: /etc/edge/edge.key

  # The billing site, plant-c.
  edge-billing:
    <<: *broker
    command: ["edge"]
    ports:
      - "5202:5200"
    environment:
      <<: *edge-env
      APP_ID: billing
    volumes:
      - ./dev/registry-compose/:/etc/edge/registry:ro
      - <<: *key
        source: ./dev/keys/edge-billing.key
        target: /etc/edge/edge.key

  # Every maintenance site, plant-d and plant-e, each with its own API.
  edge-maintenance:
    <<: *broker
    command: ["edge"]
    ports:
      - "5203:5200"
    environment:
      <<: *edge-env
      APP_ID: maintenance
    volumes:
      - ./dev/registry-compose/:/etc/edge/registry:ro
      - <<: *key
        source: ./dev/keys/edge-maintenance.key
        target: /etc/edge/edge.key
