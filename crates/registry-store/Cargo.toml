[package]
name = "registry-store"
version = "0.1.0"
edition = "2024"
publish = false
description = "The registry's installations and keys in Postgres: schema, writes with a commit-ordered change feed, and the reads the hub syncs from."

[dependencies]
base64.workspace     = true
common               = { path = "../common", default-features = false }
serde.workspace      = true
sqlx                 = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror.workspace  = true

[dev-dependencies]
common          = { path = "../common", default-features = false, features = ["alloc-stats"] }
serde_json.workspace = true
sqlx            = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio.workspace = true
