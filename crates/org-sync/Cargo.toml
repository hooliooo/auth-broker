[package]
name = "org-sync"
version = "0.1.0"
edition = "2024"
publish = false
description = "Keeps one Keycloak organization per installation of every direct kind, following the registry store; the only component holding Keycloak admin credentials."

[dependencies]
common                       = { path = "../common", default-features = false }
futures-util                 = "0.3"
registry-store               = { path = "../registry-store" }
reqwest.workspace            = true
serde_json.workspace         = true
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
