[package]
name = "test-api"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test API that verifies tokens like a real one and echoes what reached it, so e2e tests can see exactly what the hub forwarded."

[dependencies]
common               = { path = "../common", default-features = false }
keycloak             = { path = "../keycloak" }
axum.workspace       = true
base64.workspace     = true
futures-util         = "0.3"
oidc                 = { path = "../oidc" }
reqwest.workspace    = true
ring.workspace       = true
serde_json.workspace = true
tokio.workspace      = true
